# Phục vụ model nặng của Thế giới Toán (VRM nhân vật, GLB animation) qua Cloudflare named tunnel (eclass-cdn).
# Cloudflare cache ở biên (Cache Rule cho hostname eclass-cdn) → máy chủ chỉ gửi mỗi file một lần cho mỗi PoP.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types model/gltf-binary application/octet-stream;

  location = /health { default_type text/plain; return 200 "ok\n"; }

  location ~ \.glb$ {
    types { }
    default_type model/gltf-binary;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  location ~ \.vrm$ {
    types { }
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  location / { return 404; }
}
