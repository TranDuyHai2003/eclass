# Kho asset của Thế giới Toán (toàn bộ public/world: model VRM / GLB, texture, âm thanh, bộ giải mã Basis…)
# phục vụ qua Cloudflare named tunnel (eclass-cdn). Cloudflare cache ở biên (Cache Rule cho hostname eclass-cdn)
# → máy chủ chỉ gửi mỗi file một lần cho mỗi PoP. Web app trỏ tới đây bằng env WORLD_HEAVY_ASSET_BASE.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/mime.types;
  types {
    model/gltf-binary glb;
    application/octet-stream vrm;
    image/ktx2 ktx2;
    audio/ogg opus;
    audio/mp4 m4a;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types model/gltf-binary application/octet-stream application/json application/javascript text/plain image/svg+xml;

  location = /health { default_type text/plain; return 200 "ok\n"; }

  # chỉ phục vụ /world/*; mọi asset đều cho phép tải chéo nguồn (texture WebGL, fetch âm thanh, worker Basis)
  location /world/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  location / { return 404; }
}
